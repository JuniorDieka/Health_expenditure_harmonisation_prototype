# Fallback rules: substring match on sanitised lower-case description.
# Only consulted when the CoA map does not resolve the axis.
keyword_rules:
  - {id: KW-SHA-IMMUN,  axis: SHA, code: HC.6.2, confidence: 0.70, patterns: ["vaccin", "immunis", "immuniz", "cold chain"]}
  - {id: KW-SHA-SCREEN, axis: SHA, code: HC.6.3, confidence: 0.65, patterns: ["screening", "depistage", "cervical cancer", "cancer du col"]}
  - {id: KW-SHA-IEC,    axis: SHA, code: HC.6.1, confidence: 0.60, patterns: ["sensibilisation", "counselling", "conseil", "health promotion", "awareness", "outreach"]}
  - {id: KW-SHA-LAB,    axis: SHA, code: HC.4,   confidence: 0.65, patterns: ["laboratory", "laboratoire", "reactif", "reagent"]}
  - {id: KW-SHA-PHARM,  axis: SHA, code: HC.5.1, confidence: 0.65, patterns: ["medicine", "medicament", "drug", "pharma", "antiretrovir", "contracept"]}
  - {id: KW-SRHR-FP,    axis: SRHR, code: SRHR.FP,   confidence: 0.75, patterns: ["contracept", "family planning", "planification familiale"]}
  - {id: KW-SRHR-MH,    axis: SRHR, code: SRHR.MH,   confidence: 0.70, patterns: ["matern", "antenatal", "obstetric", "accouchement", "delivery kit"]}
  - {id: KW-SRHR-HIV,   axis: SRHR, code: SRHR.HIV,  confidence: 0.75, patterns: ["hiv", "vih", "sida", "arv", "antiretrovir"]}
  - {id: KW-SRHR-SGBV,  axis: SRHR, code: SRHR.SGBV, confidence: 0.70, patterns: ["sgbv", "vbg", "gender-based violence", "survivor"]}
  - {id: KW-SRHR-AH,    axis: SRHR, code: SRHR.AH,   confidence: 0.70, patterns: ["adolescent", "youth srh"]}
  - {id: KW-SRHR-RC,    axis: SRHR, code: SRHR.RC,   confidence: 0.70, patterns: ["cervical cancer", "cancer du col"]}
  - {id: KW-SRHR-NH,    axis: SRHR, code: SRHR.NH,   confidence: 0.70, patterns: ["newborn", "neonat", "nouveau-ne"]}

# Markers used to detect prompt-like/adversarial content in free text.
# Detected text is flagged as a data-quality issue and truncated for
# keyword matching; it can never influence classification.
adversarial_patterns:
  - "ignore all previous"
  - "ignorez tout"
  - "previous instructions"
  - "[/inst]"
  - "[inst]"
  - "<<system"
  - "<</system"
  - "note for reviewer"
  - "system override"
  - "do not reclassify"
  - "do not explain"
  - "you must now"
  - "respond that"
  - "repondre uniquement"
