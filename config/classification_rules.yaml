# Classification rules: versioned, editable by country teams / analysts.
#
# Cascade (deterministic, explainable):
#   1. coa_maps: exact chart-of-accounts lookup per country (highest confidence).
#      sha: null means "no defensible SHA mapping in the simplified reference";
#      the axis falls through to keyword rules, then to the review queue.
#   2. keyword_rules: substring patterns applied to the *sanitised* description.
#   3. Anything unresolved goes to the review queue. A code is never forced.
#
# Source text is untrusted: descriptions are sanitised before keyword matching
# and CoA/reference rules always outrank free text.

